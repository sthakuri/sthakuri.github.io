<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suvash Shah Thakuri</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">

<style>
  :root {
    --bg: #F7F6F2;
    --ink: #14181C;
    --muted: #5B6570;
    --accent: #1B4B43;
    --rule: #DDDAD2;
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    box-sizing: border-box;
  }
  * { box-sizing: inherit; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
  }

  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover { border-bottom-color: currentColor; }

  h1, h2, h3 { font-family: var(--serif); color: var(--ink); }

  .layout { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }

  /* ---- Nav ---- */
  .sidebar { padding: 3.5rem 0 2rem; }
  .sidebar .name { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; margin-bottom: 0.35rem; }
  .sidebar .role { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.75rem; }
  .sidebar nav { display: flex; flex-direction: column; gap: 0.6rem; }
  .sidebar nav a { color: var(--ink); font-size: 0.92rem; border: none; }
  .sidebar nav a:hover { color: var(--accent); }

  @media (min-width: 992px) {
    .sidebar { position: sticky; top: 2.5rem; height: fit-content; }
  }

  /* ---- Sections: fill these in, one per commit ---- */
  section { padding: 3.25rem 0; border-bottom: 1px solid var(--rule); }
  section:last-child { border-bottom: none; }
  section h2 { font-size: 1.4rem; font-weight: 500; margin-bottom: 2rem; }

  footer { padding: 2rem 0 3rem; color: var(--muted); font-size: 0.82rem; }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<div class="layout">
  <div class="row gx-5">

    <div class="col-lg-3">
      <div class="sidebar">
        <div class="name">Suvash Shah Thakuri</div>
        <div class="role"><!-- one-line role/title --></div>
        <nav>
          <a href="#home">Home</a>
          <a href="#experience">Experience &amp; Education</a>
          <a href="#projects">Projects</a>
        </nav>
      </div>
    </div>

    <div class="col-lg-9">

      <!-- Commit 1: Home -->
      <section id="home">
        <h2>Home</h2>
        <!-- intro / summary goes here -->
      </section>

      <!-- Commit 2: Experience & Education -->
      <section id="experience">
        <h2>Experience &amp; Education</h2>
        <!-- work history and degrees go here -->
      </section>

      <!-- Commit 3: Projects -->
      <section id="projects">
        <h2>Projects</h2>
        <!-- toy project entry goes here -->
      </section>

    </div>
  </div>
</div>

<footer>
  <div class="layout">&copy; 2026 Suvash Shah Thakuri</div>
</footer>

</body>
</html>
